<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Recommendations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Enter destination or keyword">
            <button id="searchBtn">Search</button>
            <button id="clearBtn">Clear</button>
        </div>
    </nav>

    <header>
        <h1>Welcome to Travel Recommendations</h1>
        <p>Your ultimate guide to discovering the world's most beautiful beaches, serene temples, and fascinating countries.</p>
    </header>

    <main>
        <!-- Beach Recommendation Feature -->
        <section class="recommendation">
            <h2>Top Beaches</h2>
            <div class="image-gallery">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400" alt="Tropical Beach">
                <img src="https://images.unsplash.com/photo-1499793983690-e29da59ef1c2?w=400" alt="Sunset Beach">
            </div>
        </section>

        <!-- Temple Recommendation Feature -->
        <section class="recommendation">
            <h2>Historic Temples</h2>
            <div class="image-gallery">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Konarka_Temple.jpg/400px-Konarka_Temple.jpg" alt="Ancient Temple">
                <img src="https://images.unsplash.com/photo-1548013146-72479768bada?w=400" alt="Mountain Temple">
            </div>
        </section>

        <!-- Country Recommendation Feature -->
        <section class="recommendation">
            <h2>Must-Visit Country</h2>
            <div class="image-gallery">
                <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?w=400" alt="France - Paris">
                <img src="https://images.unsplash.com/photo-1523482580672-f109ba8cb9be?w=400" alt="Australia - Sydney">
            </div>
        </section>
    </main>

    <script>
        document.getElementById('searchBtn').addEventListener('click', function() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const sections = document.querySelectorAll('.recommendation');
            
            sections.forEach(section => {
                const title = section.querySelector('h2').innerText.toLowerCase();
                // Show section if the search term matches the title
                if (title.includes(input)) {
                    section.style.display = 'block';
                } else {
                    section.style.display = 'none';
                }
            });
        });

        document.getElementById('clearBtn').addEventListener('click', function() {
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.recommendation').forEach(section => {
                section.style.display = 'block';
            });
        });
    </script>
</body>
</html>
